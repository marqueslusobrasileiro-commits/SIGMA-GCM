<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a55"/>
      <stop offset="1" stop-color="#001f47"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield -->
  <path
    d="M128 20 L208 50 V116 C208 176 164 214 128 236 C92 214 48 176 48 116 V50 Z"
    fill="url(#g)"
    stroke="#ffffff"
    stroke-width="8"
    filter="url(#shadow)"
  />

  <!-- Inner emblem -->
  <circle cx="128" cy="108" r="52" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.9"/>
  <path d="M128 66 v84" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M86 108 h84" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- SIGMA text -->
  <rect x="52" y="152" width="152" height="44" rx="16" fill="#ffffff" opacity="0.12"/>
  <text
    x="128"
    y="182"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="4"
    fill="#ffffff"
  >
    SIGMA
  </text>
</svg>

